<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 pares | Professor Moreira</title><style>*{box-sizing:border-box}body{margin:0;background:#650d29;color:white;font:18px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:20px}h1{color:#ffdf68;font-size:clamp(26px,6vw,42px)}#card{width:100%;min-height:330px;background:#fce0ed;color:#381126;border:0;border-radius:24px;padding:25px;display:flex;flex-direction:column;justify-content:center;gap:22px;cursor:pointer;transition:background .2s}#card.back{background:#d7efff;color:#12344e}#content{font-size:clamp(24px,5vw,34px);font-weight:bold;white-space:pre-line}button{font:inherit;padding:12px;border:0;border-radius:12px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}nav button{background:#ffdf68;color:#401020}progress{width:100%;accent-color:#ffdf68}small{font-size:15px}#card small{font-weight:normal} </style><main><strong>Curso de Contabilidade Professor Moreira</strong><h1>30 PARES DE MATEMÁTICA FINANCEIRA QUE CONFUNDEM NA PROVA</h1><p>Leia • Compare • Memorize</p><p id="count"></p><progress id="progress" max="30"></progress><p></p><button id="card" onclick="flip()"><small id="side"></small><span id="content"></span><small>Toque para virar o cartão</small></button><nav><button onclick="move(-1)">← Anterior</button><button onclick="move(1)">Próximo →</button><button onclick="shuffle()">Embaralhar</button><button onclick="reset()">Reiniciar</button></nav><p>Não basta decorar fórmulas. É preciso dominar os conceitos!</p></main><script>const cards=[
['Juros simples × Juros compostos','Simples: sobre o capital inicial.\nCompostos: sobre o capital acumulado.'],
['Capital × Montante','Capital: valor inicial.\nMontante: capital + juros.'],
['Capitalização × Descapitalização','Capitalização: transportar para o futuro.\nDescapitalização: transportar para o passado.'],
['Crescimento linear × Exponencial','Linear: juros simples.\nExponencial: juros compostos.'],
['Capitalização discreta × Contínua','Discreta: em períodos determinados.\nContínua: continuamente.'],
['Taxa nominal × Taxa efetiva','Nominal: referência diferente da capitalização.\nEfetiva: taxa efetivamente aplicada no período.'],
['Taxas proporcionais × Equivalentes','Proporcionais: relação aritmética entre períodos.\nEquivalentes: mesmo montante no mesmo prazo.'],
['Taxa real × Taxa aparente','Real: desconta o efeito da inflação.\nAparente: inclui o efeito da inflação.'],
['Taxa percentual × Taxa unitária','Percentual: 5%.\nUnitária: 0,05.'],
['Taxa prefixada × Pós-fixada','Prefixada: definida antecipadamente.\nPós-fixada: vinculada à evolução de um indicador.'],
['Desconto comercial × Racional','Comercial: por fora, sobre o valor nominal.\nRacional: por dentro, sobre o valor atual.'],
['Desconto simples × Composto','Simples: regime de juros simples.\nComposto: regime de juros compostos.'],
['Valor nominal × Valor atual','Nominal: valor no vencimento.\nAtual: valor em data anterior ao vencimento.'],
['Desconto financeiro × Comercial incondicional','Financeiro: associado à antecipação do pagamento.\nIncondicional: redução do preço sem condição futura.'],
['Sistema SAC × Sistema Price','SAC: amortizações constantes.\nPrice: prestações constantes.'],
['Amortização × Juros','Amortização: redução do principal da dívida.\nJuros: remuneração do capital emprestado.'],
['Prestação × Saldo devedor','Prestação: amortização + juros.\nSaldo devedor: principal ainda não amortizado.'],
['Amortizações no SAC × No Price','SAC: constantes.\nPrice: crescentes em progressão geométrica.'],
['Prestações no SAC × No Price','SAC: decrescentes.\nPrice: constantes.'],
['Sistema Americano × Sistema Price','Americano: principal liquidado no vencimento.\nPrice: principal amortizado periodicamente.'],
['Renda antecipada × Postecipada','Antecipada: pagamentos no início dos períodos.\nPostecipada: pagamentos no final dos períodos.'],
['Renda temporária × Perpétua','Temporária: quantidade finita de pagamentos.\nPerpétua: pagamentos indefinidamente.'],
['Renda imediata × Diferida','Imediata: sem carência adicional.\nDiferida: com período de carência.'],
['Renda uniforme × Variável','Uniforme: pagamentos iguais.\nVariável: pagamentos de valores diferentes.'],
['Valor presente × Valor futuro de uma renda','Presente: pagamentos descontados para a data inicial.\nFuturo: pagamentos acumulados.'],
['Ágio × Deságio','Ágio: valor acima do nominal.\nDeságio: valor abaixo do nominal.'],
['Lucro sobre o custo × Sobre a venda','Sobre o custo: lucro ÷ custo.\nSobre a venda: lucro ÷ preço de venda.'],
['Rentabilidade bruta × Líquida','Bruta: antes dos impostos e custos.\nLíquida: depois dos impostos e custos.'],
['Rentabilidade positiva × Negativa','Positiva: ganho financeiro.\nNegativa: perda financeira.'],
['Inflação × Deflação','Inflação: aumento generalizado dos preços.\nDeflação: redução generalizada dos preços.']];let order=cards.map((_,i)=>i),pos=0,back=false;try{let s=JSON.parse(localStorage.getItem('moreira-pares30'));if(s&&s.order.length===30){order=s.order;pos=Math.max(0,Math.min(29,s.pos))}}catch(e){}function render(){document.getElementById('count').textContent=`Cartão ${pos+1} de 30`;document.getElementById('progress').value=pos+1;document.getElementById('card').classList.toggle('back',back);document.getElementById('side').textContent=back?'RESPOSTA':'QUAL É A DIFERENÇA?';document.getElementById('content').textContent=cards[order[pos]][back?1:0];try{localStorage.setItem('moreira-pares30',JSON.stringify({order,pos}))}catch(e){}}function flip(){back=!back;render()}function move(d){pos=Math.max(0,Math.min(29,pos+d));back=false;render()}function reset(){order=cards.map((_,i)=>i);pos=0;back=false;render()}function shuffle(){for(let i=29;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;back=false;render()}render();</script></html>
